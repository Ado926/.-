<script>
  const menuBtn = document.querySelector('.menu-icon');
  const menuPanel = document.querySelector('.menu-panel');
  const contentBox = document.getElementById('dynamic-content');

  menuBtn.addEventListener('click', () => {
    menuPanel.classList.toggle('hidden');
  });

  function showTerminal() {
    contentBox.innerHTML = `<h2>Terminal Simulada</h2><p>🧮 Aquí puedes simular comandos de servidor.</p>`;
    menuPanel.classList.add('hidden');
  }

  function showDatabase() {
    contentBox.innerHTML = `<h2>Crear Base de Datos</h2><p>📁 Esta es una sección simulada para la creación de bases de datos.</p>`;
    menuPanel.classList.add('hidden');
  }

  function supportTicket() {
    window.location.href = "tel:+18293142989";
  }
</script>
