<!DOCTYPE html>
<html>
<head>
  <title>Navegador LocalStorage</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; }
    #tabs button { margin: 2px; }
    #viewer { width: 100%; height: 400px; border: 1px solid #ccc; }
    #urlInput { width: 60%; }
    .section { margin-bottom: 20px; }
    h1 { font-size: 1.5em; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Navegador Web LocalStorage</h1>

  <div class="section">
    <div id="tabs"></div>
    <input id="urlInput" placeholder="URL aquí..." />
    <button onclick="openTab()">Abrir pestaña</button>
    <button onclick="addFavorite()">Favorito</button>
    <button onclick="newTab()">Nueva pestaña</button>
    <button onclick="closeTab()">Cerrar pestaña</button>
  </div>

  <iframe id="viewer"></iframe>

  <div class="section">
    <h2>Historial</h2>
    <button onclick="clearHistory()">Borrar historial</button>
    <ul id="history"></ul>
  </div>
  <div class="section">
    <h2>Favoritos</h2>
    <button onclick="clearFavorites()">Borrar favoritos</button>
    <ul id="favorites"></ul>
  </div>

  <script>
    // ----- Data -----
    let tabs = JSON.parse(localStorage.getItem('tabs') || '[]');
    let history = JSON.parse(localStorage.getItem('history') || '[]');
    let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    let currentTab = parseInt(localStorage.getItem('currentTab')) || 0;

    function saveAll() {
      localStorage.setItem('tabs', JSON.stringify(tabs));
      localStorage.setItem('history', JSON.stringify(history));
      localStorage.setItem('favorites', JSON.stringify(favorites));
      localStorage.setItem('currentTab', currentTab);
    }

    // ----- Render -----
    function renderTabs() {
      const tabDiv = document.getElementById('tabs');
      tabDiv.innerHTML = '';
      tabs.forEach((url, i) => {
        const btn = document.createElement('button');
        btn.textContent = url ? url : 'Nueva';
        btn.style.fontWeight = (i === currentTab) ? 'bold' : 'normal';
        btn.onclick = () => { currentTab = i; openTab(url); };
        tabDiv.appendChild(btn);
      });
    }

    function renderHistory() {
      const ul = document.getElementById('history');
      ul.innerHTML = '';
      history.slice(-30).reverse().forEach(url => {
        const li = document.createElement('li');
        li.textContent = url;
        li.onclick = () => openTab(url);
        ul.appendChild(li);
      });
    }

    function renderFavorites() {
      const ul = document.getElementById('favorites');
      ul.innerHTML = '';
      favorites.forEach(url => {
        const li = document.createElement('li');
        li.textContent = url;
        li.onclick = () => openTab(url);
        ul.appendChild(li);
      });
    }

    // ----- Actions -----
    function openTab(url) {
      url = url || document.getElementById('urlInput').value;
      if (!url) return;
      tabs[currentTab] = url;
      document.getElementById('viewer').src = url;
      document.getElementById('urlInput').value = url;
      history.push(url);
      saveAll();
      renderTabs();
      renderHistory();
      renderFavorites();
    }

    function addFavorite() {
      const url = tabs[currentTab];
      if (url && !favorites.includes(url)) {
        favorites.push(url);
        saveAll();
        renderFavorites();
      }
    }

    function newTab() {
      tabs.push('');
      currentTab = tabs.length - 1;
      saveAll();
      renderTabs();
      document.getElementById('urlInput').value = '';
      document.getElementById('viewer').src = '';
    }

    function closeTab() {
      if (tabs.length > 1) {
        tabs.splice(currentTab, 1);
        currentTab = Math.max(0, currentTab - 1);
        saveAll();
        renderTabs();
        let url = tabs[currentTab];
        document.getElementById('urlInput').value = url || '';
        document.getElementById('viewer').src = url || '';
      }
    }

    function clearHistory() {
      history = [];
      saveAll();
      renderHistory();
    }

    function clearFavorites() {
      favorites = [];
      saveAll();
      renderFavorites();
    }

    // ----- INIT -----
    if (tabs.length === 0) tabs = [''];
    renderTabs();
    renderHistory();
    renderFavorites();
    let url = tabs[currentTab] || '';
    document.getElementById('urlInput').value = url;
    document.getElementById('viewer').src = url;

  </script>
</body>
</html>
