<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar videos de YouTube</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #formulario {
            width: 80%;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div id="formulario">
        <h2>Descargar video de YouTube</h2>
        <input type="text" id="url" placeholder="Ingrese la URL del video">
        <button id="descargar">Descargar</button>
        <div id="resultado"></div>
    </div>

    <script>
        const urlInput = document.getElementById('url');
        const descargarButton = document.getElementById('descargar');
        const resultadoDiv = document.getElementById('resultado');

        descargarButton.addEventListener('click', async () => {
            const url = urlInput.value;
            const apiUrl = `https://ruby-core.vercel.app/api/download/youtube/dlv2?url=${encodeURIComponent(url)}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status) {
                    // Procesar la respuesta exitosa
                    resultadoDiv.innerText = 'Video descargado con éxito';
                } else {
                    resultadoDiv.innerText = data.error;
                }
            } catch (error) {
                console.error(error);
                resultadoDiv.innerText = 'Error al descargar el video';
            }
        });
    </script>
</body>
</html>
