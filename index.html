<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Ventas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #333;
        }
        p {
            color: #555;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 10px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .product-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 15px;
            width: 200px;
            text-align: center;
        }
        .product-card img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .prices {
            text-align: left;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .back-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 8px 15px;
            font-size: 14px;
            background-color: #6c757d;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        @media (max-width: 600px) {
            .product-card {
                width: 100%;
                max-width: 300px;
            }
            .btn {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="home" class="container section active">
        <h1>¡Hola! Bienvenido a este panel de ventas.</h1>
        <p>Nos complace brindarte nuestros productos para que los disfrutes con provecho.</p>
        <button class="btn" onclick="showSection('menu')">Entrar</button>
    </div>

    <div id="menu" class="container section">
        <button class="btn" onclick="showSection('products')">Productos</button>
        <button class="btn" onclick="showSection('prices')">Precios</button>
    </div>

    <div id="products" class="container section">
        <button class="btn back-btn" onclick="showSection('home')">Volver</button>
        <div class="products">
            <div class="product-card">
                <img src="https://qu.ax/bXinP.jpg" alt="Denji Bot MD">
                <p>Denji Bot MD</p>
            </div>
            <div class="product-card">
                <img src="https://qu.ax/caXVr.jpg" alt="Makima MD">
                <p>Makima MD</p>
            </div>
        </div>
    </div>

    <div id="prices" class="container section">
        <button class="btn back-btn" onclick="showSection('home')">Volver</button>
        <div class="prices">
            <p>Producto #1: 1 dólar por semana</p>
            <p>Producto #2: 3 dólares por semana</p>
            <p>Producto #1 Prox: 20 dólares</p>
            <p>Producto #2 Prox: 30 dólares</p>
        </div>
    </div>

    <script>
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(sectionId).classList.add('active');
        }
    </script>
</body>
</html>
