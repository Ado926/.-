<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proveedor KakTak</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <style>
    body {
      background: #111;
      color: #0f0;
      font-family: Arial,sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      text-align: center;
    }
    .btn-grn {
      background: #0f0;
      color: #111;
      border: none;
      padding: 12px 32px;
      margin-top: 24px;
      border-radius: 6px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: box-shadow .2s;
      box-shadow: 0 2px 8px #0008;
    }
    .btn-grn:hover {
      box-shadow: 0 4px 24px #0f08;
    }
    .menu-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      background: #222;
      border: none;
      color: #0f0;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      box-shadow: 0 2px 8px #0006;
      cursor: pointer;
    }
    .menu-btn span {
      display: block;
      width: 30px;
      height: 5px;
      background: #0f0;
      margin: 4px 0;
      border-radius: 3px;
      transition: .3s;
    }
    .menu-drawer {
      position: fixed;
      top: 0; right: 0;
      width: 320px; max-width: 96vw;
      height: 100vh;
      background: #181818;
      color: #0f0;
      box-shadow: -2px 0 24px #0009;
      z-index: 99;
      transform: translateX(100%);
      transition: transform .3s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .menu-drawer.open {
      transform: translateX(0);
    }
    .menu-drawer img {
      margin-top: 28px;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      box-shadow: 0 2px 16px #0005;
      object-fit: cover;
      background: #222;
      border: 3px solid #0f0;
    }
    .menu-drawer .menu-title {
      margin: 14px 0 30px 0;
      font-size: 1.3em;
      font-weight: bold;
      color: #0f0;
      text-shadow: 0 2px 10px #0006;
    }
    .menu-drawer .menu-option {
      width: 90%;
      border: none;
      background: none;
      color: #0f0;
      font-size: 1.1em;
      padding: 13px 0;
      margin: 3px 0;
      text-align: left;
      cursor: pointer;
      border-bottom: 1px solid #222;
      transition: background .2s;
    }
    .menu-drawer .menu-option:hover {
      background: #222;
    }
    .close-menu {
      position: absolute;
      top: 18px;
      left: 18px;
      background: none;
      border: none;
      font-size: 2em;
      color: #0f0;
      cursor: pointer;
    }
    .content-area {
      padding: 40px 12px 12px 12px;
      max-width: 600px;
      margin: 0 auto;
      min-height: 80vh;
    }
    a {
      color: #0f0;
      text-decoration: underline;
      word-break: break-all;
    }
    @media (max-width: 600px) {
      .content-area { padding: 32px 6px 6px 6px; }
      .menu-drawer { width: 97vw; }
    }
  </style>
</head>
<body>
  <!-- Pantalla Inicial -->
  <div id="pantallaInicio" class="center">
    <h1>Proveedor KakTak</h1>
    <button class="btn-grn" onclick="entrar()">Entrar</button>
  </div>
  <!-- Pantalla Bienvenida -->
  <div id="pantallaBienvenida" class="hidden">
    <div class="content-area">
      <h2>Bienvenido a KatTak el proveedor gratis que necesitas.</h2>
      <p>
        Por el momento estamos disponiendo solo de <b>VPS</b> y <b>dominios gratis</b> pero más adelante estaremos actualizando para más cosas.<br><br>
        Puedes acceder a nuestro menú para más información.
      </p>
    </div>
  </div>
  <!-- Contenido dinámico del menú -->
  <div id="pantallaContenido" class="hidden">
    <div class="content-area" id="contenidoDinamico"></div>
  </div>
  <!-- Botón menú hamburguesa -->
  <button id="menuBtn" class="menu-btn hidden" title="Menú">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <!-- Menú Drawer -->
  <div id="menuDrawer" class="menu-drawer">
    <button class="close-menu" onclick="toggleMenu(false)">×</button>
    <img src="https://qu.ax/YCAKN.jpg" alt="KakTak">
    <div class="menu-title">Dash KakTak Proveedor</div>
    <button class="menu-option" onclick="cargarOpcion('vps')">Vps</button>
    <button class="menu-option" onclick="cargarOpcion('dominio')">Dominio</button>
    <button class="menu-option" onclick="cargarOpcion('panel')">Hosting Panel</button>
    <button class="menu-option" onclick="cargarOpcion('dash')">Hosting Dash</button>
  </div>
  <script>
    // Mostrar/ocultar pantallas
    function entrar(){
      document.getElementById('pantallaInicio').classList.add('hidden');
      document.getElementById('pantallaBienvenida').classList.remove('hidden');
      document.getElementById('menuBtn').classList.remove('hidden');
    }
    function toggleMenu(show){
      document.getElementById('menuDrawer').classList.toggle('open', show);
    }
    document.getElementById('menuBtn').onclick = function(){ toggleMenu(true); };

    // Opciones del menú
    function cargarOpcion(opc){
      toggleMenu(false);
      document.getElementById('pantallaBienvenida').classList.add('hidden');
      document.getElementById('pantallaContenido').classList.remove('hidden');
      let contenido = "";
      if(opc === 'vps'){
        contenido = `<h2>VPS Gratis / Prueba</h2>
          <ul style="list-style: disc;">
            <li><a href="https://www.oracle.com/cloud/free/" target="_blank">Oracle Cloud Free Tier</a></li>
            <li><a href="https://aws.amazon.com/free/" target="_blank">AWS Free Tier (12 meses)</a></li>
            <li><a href="https://azure.microsoft.com/free/" target="_blank">Azure Free Tier (30 días, $200 crédito)</a></li>
            <li><a href="https://cloud.google.com/free" target="_blank">Google Cloud Free ($300 crédito, 90 días)</a></li>
            <li><a href="https://www.alwaysfree.cloud/" target="_blank">AlwaysFree Cloud</a></li>
            <li><a href="https://www.heroku.com/free" target="_blank">Heroku Free (Apps)</a></li>
            <li><a href="https://www.ibm.com/cloud/free" target="_blank">IBM Cloud Free Tier</a></li>
            <li><a href="https://www.vultr.com/free/" target="_blank">Vultr Free (promos ocasionales)</a></li>
            <li><a href="https://www.linode.com/free-credit/" target="_blank">Linode ($100 crédito, 60 días)</a></li>
            <li><a href="https://www.hetzner.com/cloud" target="_blank">Hetzner (pruebas, no siempre disponibles)</a></li>
          </ul>`;
      } else if(opc === 'dominio'){
        contenido = `<h2>Dominios Gratis / Prueba</h2>
        <ul style="list-style: disc;">
          <li><a href="https://www.freenom.com/" target="_blank">Freenom (.tk, .ml, .ga, .cf, .gq gratis)</a></li>
          <li><a href="https://www.dot.tk/en/" target="_blank">Dot.tk</a></li>
          <li><a href="https://eu.org/" target="_blank">EU.org (dominio gratis)</a></li>
          <li><a href="https://get.tech/free" target="_blank">Get.tech (prueba .tech gratis)</a></li>
          <li><a href="https://www.namcheap.com/promos/free-domain/" target="_blank">Namecheap (promos ocasionales)</a></li>
          <li><a href="https://www.infinityfree.com/" target="_blank">InfinityFree (subdominios gratis)</a></li>
          <li><a href="https://www.dot.cf/" target="_blank">Dot.cf</a></li>
        </ul>`;
      } else if(opc === 'panel'){
        contenido = `<h2>Hosting Panel</h2>
        <p>
          <b>Nuestros Paneles están en proceso de creación</b> al junto de un dominio para que alojes tu host.
        </p>`;
      } else if(opc === 'dash'){
        contenido = `<h2>Hosting Dash</h2>
        <p>
          <b>Nuestras Dash están en proceso de creación</b> al junto de un dominio para que alojes tu host.
        </p>`;
      }
      document.getElementById('contenidoDinamico').innerHTML = contenido + `<br><button class="btn-grn" onclick="volverInicio()">Volver</button>`;
    }
    function volverInicio(){
      document.getElementById('pantallaContenido').classList.add('hidden');
      document.getElementById('pantallaBienvenida').classList.remove('hidden');
    }
    // Ocultar/mostrar helper
    document.querySelectorAll('.hidden').forEach(el => el.style.display = 'none');
    function updatePantallas(){
      document.getElementById('pantallaInicio').style.display = document.getElementById('pantallaInicio').classList.contains('hidden') ? 'none' : 'flex';
      document.getElementById('pantallaBienvenida').style.display = document.getElementById('pantallaBienvenida').classList.contains('hidden') ? 'none' : 'block';
      document.getElementById('pantallaContenido').style.display = document.getElementById('pantallaContenido').classList.contains('hidden') ? 'none' : 'block';
      document.getElementById('menuBtn').style.display = document.getElementById('pantallaBienvenida').classList.contains('hidden') ? 'none' : 'flex';
    }
    // Observador para cambios en clases
    setInterval(updatePantallas, 100);
  </script>
</body>
</html>
