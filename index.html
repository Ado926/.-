<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Panel Akirax</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <button class="menu-icon">☰</button>
      <span class="coin-balance">💰 0,00</span>
      <span class="username">👤 Feli</span>
      <span class="notification">🔔 1</span>
    </nav>
  </header>

  <main>
    <h1 class="panel-title">Panel</h1>
    <section class="cards">
      <div class="card">
        <h2>🖥️ Servidores</h2>
        <p>0</p>
      </div>
      <div class="card">
        <h2>💸 Monedas Akirax</h2>
        <p>0,00</p>
      </div>
    </section>

    <section class="motd">
      <h2>Anfitrión de Akirax - MOTD</h2>
      <img src="motd.jpg" alt="Imagen MOTD" />
    </section>
  </main>

  <footer class="footer">
    <p>© 2021-2025 Akirax Host. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
