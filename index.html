<!DOCTYPE html>
<html>
<head>
	<title>Mantenimiento</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #007bff; /* Azul brillante */
			text-align: center;
			color: #ffffff; /* Texto blanco */
			margin: 0;
			padding: 0;
			height: 100vh; /* Altura de la pantalla */
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}
		
		.mensaje {
			font-size: 96px; /* Tamaño de fuente más grande */
			font-weight: bold;
			margin-bottom: 20px;
		}
		
		.detalle {
			font-size: 36px; /* Tamaño de fuente más grande */
			margin-bottom: 40px;
		}
		
		.boton {
			background-color: #ffffff; /* Fondo blanco */
			color: #007bff; /* Texto azul */
			padding: 20px 40px;
			border: none;
			border-radius: 10px;
			cursor: pointer;
			font-size: 24px;
			margin-bottom: 40px;
		}
		
		.boton:hover {
			background-color: #f2f2f2; /* Fondo gris claro al pasar el mouse */
		}
		
		.footer {
			position: fixed;
			bottom: 0;
			width: 100%;
			padding: 20px;
			background-color: #0069d9; /* Azul más oscuro */
			color: #ffffff; /* Texto blanco */
			font-size: 18px;
		}
	</style>
</head>
<body>
	<div class="mensaje">🛠️ MANTENIMIENTO</div>
	<div class="detalle">El hosting está recibiendo un arduo mantenimiento debido a un fallo que hubo en el nodo.</div>
	<button class="boton" onclick="alert('Este panel está protegido por derechos de autor.')">Ver proceso</button>
	<div class="footer">&copy; 2025 - Maki Host | Todos los derechos reservados</div>
</body>
</html>
