
<!DOCTYPE html>
<html>
<head>
    <title>Zapia Web Chat</title>
    <style>
        body { font-family: sans-serif; }
        #chatbox { width: 80%; height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; }
        #inputbox { width: 70%; }
        button { width: 20%; }
    </style>
</head>
<body>
    <h1>Zapia Web Chat</h1>
    <div id="chatbox">
        <p>¡Hola! Soy Zapia, tu asistente virtual.</p>
    </div>
    <div>
        <input type="text" id="inputbox" placeholder="Escribe tu mensaje...">
        <button onclick="sendMessage()">Enviar</button>
    </div>
    <script>
        function sendMessage() {
            var inputbox = document.getElementById("inputbox");
            var chatbox = document.getElementById("chatbox");
            var message = inputbox.value;
            chatbox.innerHTML += "<p>Tú: " + message + "</p>";
            inputbox.value = "";

            // Aquí iría la lógica para conectar con una API de IA y obtener una respuesta.
            // Por ahora, solo mostraremos una respuesta predefinida.
            setTimeout(function() {
                chatbox.innerHTML += "<p>Zapia: Lo siento, no puedo responder a eso en este momento.</p>";
            }, 1000);
        }
    </script>
</body>
</html>
