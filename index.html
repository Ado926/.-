<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #chat-container {
            width: 80%;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        #chat-log {
            padding: 20px;
            overflow-y: auto;
            max-height: 400px;
        }
        #input-container {
            padding: 10px;
            border-top: 1px solid #ccc;
        }
        #input-field {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
        }
        #send-button {
            width: 20%;
            padding: 10px;
            font-size: 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-log"></div>
        <div id="input-container">
            <input type="text" id="input-field" placeholder="Escribe un mensaje...">
            <button id="send-button">Enviar</button>
        </div>
    </div>

    <script>
        const chatLog = document.getElementById('chat-log');
        const inputField = document.getElementById('input-field');
        const sendButton = document.getElementById('send-button');
        const apiUrl = 'https:                                 

        sendButton.addEventListener('click', async () => {
            const message = inputField.value;
            inputField.value = '';

                                                      
            const userMessage = document.createElement('div');
            userMessage.textContent = `Tú: ${message}`;
            chatLog.appendChild(userMessage);

                                        
            const response = await fetch(`${apiUrl}?message=${encodeURIComponent(message)}`);
            const data = await response.json();

                                                      
            const apiResponse = document.createElement('div');
            apiResponse.textContent = `Bot: ${data.result.response}`;
            chatLog.appendChild(apiResponse);

            // Desplazar el chat log hacia abajo
            chatLog.scrollTop = chatLog.scrollHeight;
        });
    </script>
</body>
</html>
