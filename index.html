<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuncio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        
        .imagen-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Meta_Logo.png/800px-Meta_Logo.png'); 
            background-size: cover;
            background-position: center;
        }
        
        .anuncio {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="imagen-container">
        <div class="anuncio">ANUNCIO</div>
    </div>
</body>
</html>
